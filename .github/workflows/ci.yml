# WinRecovery CI — the gate from AGENTS.md, enforced.
#
# Two jobs, because a Windows-only host can never fail the cross-target steps
# that AGENTS.md requires: on `windows-latest` the host triple already *is*
# x86_64-pc-windows-msvc, so `clippy --target x86_64-pc-windows-msvc` is a
# no-op that proves nothing. CI run #1 failed on Windows-only lints the host
# clippy could not see; the `cross` job below is what keeps that class of
# failure caught when the host is not Windows.
#
#   gate   windows-latest  full suite natively, C consumer build, artifacts
#   cross  ubuntu-latest   pure-logic suite + the mandated Windows-target gate
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, so a green build can be produced for on-machine
  # verification without a throwaway commit.
  workflow_dispatch:

permissions:
  contents: read
  # Only so the MSVC step can post its own compiler output to the PR when it
  # fails; see the note on Report-Failure below.
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Recorded in the job summary: the toolchain a failure was produced by is
      # the first thing needed to diagnose it, and CI logs are not always
      # reachable from every environment.
      - name: Record toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          {
            echo '### Toolchain (windows-latest)'
            echo '```'
            rustc --version
            cargo --version
            cargo clippy --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Host clippy. On this runner the host is the MSVC target, so this is
      # also the Windows-target clippy pass AGENTS.md asks for; the `cross`
      # job runs the same target from a non-Windows host.
      - name: clippy (host = x86_64-pc-windows-msvc)
        run: cargo clippy --all-targets -- -D warnings

      - name: test (full suite, natively on Windows)
        run: cargo test --locked

      - name: release build
        run: cargo build --release --locked

      # The C consumer contract: compile real C against the built import
      # library and run it. This is the evidence behind the README's
      # "C consumer smoke test passes" line — the Rust tests can only see the
      # Rust side of the ABI.
      # Records what MSVC toolchain is actually present on the runner, into
      # the job summary (readable without the raw logs) and the build log.
      - name: Record MSVC toolchain layout
        shell: bash
        run: |
          {
            echo '### MSVC toolchain layout (windows-latest)'
            echo '```'
            ls -1 "/c/Program Files/Microsoft Visual Studio" 2>&1 || true
            echo '--- vswhere: all instances with VC tools ---'
            "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
              -all -prerelease -requires VC.Tools.x86.x64 \
              -property installationPath 2>&1 || true
            echo '--- DevShell module present? ---'
            ls -1 "/c/Program Files/Microsoft Visual Studio/Common7/Tools/Microsoft.VisualStudio.DevShell.dll" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build C consumer tests (MSVC)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # The Rust MSVC target already links on this runner, so a VC toolchain
          # is definitely installed; vswhere is the supported way to find it.
          # Locate it rather than hardcoding a version directory:
          # `windows-latest` is a moving label (Server 2022 -> 2025, VS2026
          # images rolling out), and a pinned path breaks the next time it
          # moves — which is what an earlier revision of this step did.
          $vswhere = @(
            (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vswhere) { throw 'vswhere.exe not found' }

          $vsPath = & $vswhere -latest -all -prerelease -requires VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vsPath) { throw 'no Visual Studio install with VC tools found' }
          Write-Host "Visual Studio: $vsPath"

          # vcvars64.bat is used instead of the DevShell PowerShell module: it is
          # the documented MSVC entry point, exists in every VS layout (2022 and
          # 2026), and running the compiler in the same cmd invocation as the
          # environment setup avoids depending on how the module exports env
          # vars into pwsh.
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }

          foreach ($f in 'winrecovery.dll', 'winrecovery.dll.lib') {
            if (-not (Test-Path "target/release/$f")) {
              throw "missing Rust build output: target/release/$f"
            }
          }

          # Posts this step's own captured output to the PR. Raw job logs are
          # served from a host that is unreachable from some development
          # environments, and the job summary is not exposed via the REST API,
          # so the step reports itself instead of relying on either.
          function Report-Failure([string]$phase, [string]$output, [int]$code) {
            Write-Host "--- $phase failed (exit $code) ---"
            Write-Host $output
            if ('${{ github.event_name }}' -eq 'pull_request') {
              $body = @(
                "### CI: $phase failed (exit $code)",
                '',
                '- Runner: ${{ runner.os }} / ${{ runner.arch }}',
                "- Visual Studio: $vsPath",
                '- Commit: ${{ github.sha }}',
                '',
                '```',
                ($output -split "\r?\n" | Select-Object -Last 90),
                '```'
              ) -join "\n"
              gh pr comment ${{ github.event.pull_request.number }} --body $body 2>&1 |
                Write-Host
            }
            exit 1
          }

          # Print the compiler version: it identifies the toolchain a failure
          # came from, which is the first thing needed to diagnose it.
          $verOut = cmd /c "call `"$vcvars`" >nul 2>&1 && cl 2>&1"
          Write-Host ($verOut -join "\n")

          # /W4 /WX on the contract test: it is the gated assertion, so a new
          # warning there should be looked at, not ignored. The example is
          # documentation, so it builds at /W4 without /WX and is not gated.
          $out = cmd /c "call `"$vcvars`" >nul 2>&1 && cl /nologo /W4 /WX /I include examples/c/contract.c /Fe:target/release/contract.exe /link target/release/winrecovery.dll.lib 2>&1"
          $code = $LASTEXITCODE
          Write-Host ($out -join "\n")
          if ($code -ne 0) { Report-Failure 'cl contract.c' ($out -join "\n") $code }

          $out = cmd /c "call `"$vcvars`" >nul 2>&1 && cl /nologo /W4 /I include examples/c/example.c /Fe:target/release/example.exe /link target/release/winrecovery.dll.lib 2>&1"
          $code = $LASTEXITCODE
          Write-Host ($out -join "\n")
          if ($code -ne 0) { Report-Failure 'cl example.c' ($out -join "\n") $code }

          Write-Host 'MSVC build OK'

      # contract.exe is the assertion: every read-only entry point must obey
      # the documented contract (non-NULL valid JSON, or NULL plus a WR_ERR_*
      # code and a message), whatever this machine's System Restore state is.
      # example.exe is the documentation: it shows the happy path, so its
      # output is printed but its exit code is not gated — a CI runner with
      # System Restore off is not a library defect.
      - name: Run C consumer contract test
        run: .\target\release\contract.exe

      - name: Run C example (output only, not gated)
        continue-on-error: true
        run: .\target\release\example.exe

      # smoke-test.ps1 tells users to take the DLL from a CI run's artifacts;
      # this is that artifact. The header is copied in so the download is
      # self-contained for a C consumer.
      - name: Stage header next to the binaries
        run: copy include\winrecovery.h target\release\winrecovery.h

      - name: Upload winrecovery.dll + import library + header
        uses: actions/upload-artifact@v7
        with:
          name: winrecovery-windows-x64
          path: |
            target/release/winrecovery.dll
            target/release/winrecovery.dll.lib
            target/release/winrecovery.h
          if-no-files-found: error
          retention-days: 30

  cross:
    name: cross-target gate (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          {
            echo '### Toolchain (ubuntu-latest, cross-target)'
            echo '```'
            rustc --version
            cargo --version
            cargo clippy --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Host clippy never sees the cfg(windows) module, so it is run for
      # completeness only; the two steps below are the real gate.
      - name: clippy (Linux host, pure-logic code)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (x86_64-pc-windows-msvc, all targets)
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: check (x86_64-pc-windows-msvc, all targets)
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

      - name: test (pure logic + FFI contract off-Windows)
        run: cargo test --locked

      - name: release build (Linux cdylib, host)
        run: cargo build --release --locked
